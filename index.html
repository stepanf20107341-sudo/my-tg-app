<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web App</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Привет, <span id="user-name">Гость</span>!</h1>
    <p>Это окно Web App внутри Telegram.</p>
    
    <!-- Кнопка, которая отправит данные обратно в чат с ботом -->
    <button id="send-data-btn">Отправить данные боту</button>

    <script>
        // Инициализируем объект Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что интерфейс загрузился

        // Расширяем на весь экран (опционально)
        tg.expand();

        // Отображаем имя пользователя, если оно доступно
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Обработка клика на кнопку
        document.getElementById('send-data-btn').addEventListener('click', () => {
            const dataToSend = { message: "Привет из Web App!", status: "success" };
            
            // Отправляем данные в виде строки обратно боту
            tg.sendData(JSON.stringify(dataToSend));
            
            // Закрываем мини-приложение
            tg.close();
        });
    </script>
</body>
</html>
