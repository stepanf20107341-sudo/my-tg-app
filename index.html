<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG App</title>
    <!-- Підключаємо базовий скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #17212b;
            color: #ffffff;
            text-align: center;
            padding-top: 50px;
            margin: 0;
        }
        .card {
            background-color: #242f3d;
            padding: 30px;
            border-radius: 16px;
            display: inline-block;
            width: 80%;
            max-width: 300px;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Мій Клікер ⚡</h2>
        <h3>🪙 Баланс: <span id="counter">0</span></h3>
        <button id="click-btn">Натисни мене! ⚡</button>
    </div>

    <script>
        // Ініціалізуємо Telegram WebApp
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var count = 0;
        var display = document.getElementById('counter');
        var button = document.getElementById('click-btn');

        // Найпростіший клікер на чистій функції
        button.onclick = function() {
            count = count + 1;
            display.innerText = count;
        };
    </script>
</body>
</html>
