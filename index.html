<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Clicker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #17212b;
            color: #ffffff;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .card {
            background-color: #242f3d;
            padding: 30px;
            border-radius: 20px;
            margin-top: 50px;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Мій Клікер ⚡</h2>
        <h3 style="color: #f59e0b;">🪙 Монет: <span id="bal">0</span></h3>
        <button id="btn">Заробити 1 монету ⚡</button>
    </div>

    <script>
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var balance = 0;

        // Чистый клик по кнопке без блокировок
        document.getElementById('btn').onclick = function() {
            balance = balance + 1;
            document.getElementById('bal').innerText = balance;
        };
    </script>
</body>
</html>
