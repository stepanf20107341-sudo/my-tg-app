<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG App</title>
    <!-- Підключаємо скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #17212b;
            color: #ffffff;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        .card {
            background-color: #242f3d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="name">Користувач</h2>
        <h3 style="color: #f59e0b;">🪙 Баланс: <span id="bal">0</span></h3>
        <button id="btn">Заробити 1 монету ⚡</button>
    </div>

    <script>
        // Ініціалізація
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var balance = 0;

        // Одразу міняємо текст, щоб перевірити роботу скрипта
        document.getElementById('name').innerText = "Клікер аккаунта";

        // Пробуємо взяти ім'я
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('name').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Клік на кнопку
        document.getElementById('btn').onclick = function() {
            balance = balance + 1;
            document.getElementById('bal').innerText = balance;
        };
    </script>
</body>
</html>
