<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вірт Моделі України</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 0 80px;
            background: #0b0f14;
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .header {
            padding: 18px 15px;
            text-align: center;
            background: #121820;
            border-bottom: 1px solid #1f2937;
        }

        .header h1 {
            margin: 0;
            color: #ff4a85;
            font-size: 20px;
        }

        .toolbar {
            padding: 12px;
            background: #121820;
            border-bottom: 1px solid #1f2937;
        }

        .filter-button {
            border: 0;
            background: #e11d48;
            color: white;
            padding: 10px 16px;
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .filters {
            display: none;
            padding: 12px;
            background: #0f151d;
            border-bottom: 1px solid #1f2937;
        }

        .filters.show {
            display: block;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #263241;
            border-radius: 8px;
            background: #121820;
            color: white;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #ff4a85;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .model-card {
            position: relative;
            overflow: hidden;
            background: #121820;
            border: 1px solid #263241;
            border-radius: 12px;
            cursor: pointer;
        }

        .model-photo {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #202938;
        }

        .vip {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 7px;
            border-radius: 5px;
            background: #eab308;
            color: black;
            font-size: 10px;
            font-weight: bold;
        }

        .price {
            position: absolute;
            right: 8px;
            top: 190px;
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, .8);
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        .card-info {
            padding: 10px;
        }

        .name {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
        }

        .params {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #94a3b8;
            font-size: 12px;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .profile {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .back {
            margin-bottom: 15px;
            padding: 9px 14px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1a232e;
            color: white;
            cursor: pointer;
        }

        .profile-photo {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
        }

        .profile-name {
            margin-top: 15px;
            font-size: 25px;
            font-weight: bold;
        }

        .profile-params {
            display: flex;
            gap: 15px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .price-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #263241;
            border-radius: 12px;
            background: #121820;
        }

        .price-box h3 {
            margin-top: 0;
            color: #ff4a85;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-top: 1px solid #263241;
        }

        .price-number {
            color: #f59e0b;
            font-weight: bold;
        }

        .cabinet {
            max-width: 550px;
            margin: auto;
            padding: 20px;
        }

        .cabinet h2 {
            text-align: center;
            color: #ff4a85;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .save {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .bottom {
            position: fixed;
            z-index: 100;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #121820;
            border-top: 1px solid #263241;
        }

        .menu {
            color: #64748b;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }

        .menu.active {
            color: #ff4a85;
        }

        .icon {
            display: block;
            margin-bottom: 3px;
            font-size: 20px;
        }

        @media (max-width: 500px) {
            .catalog {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 8px;
            }

            .model-photo {
                height: 180px;
            }

            .price {
                top: 150px;
            }

            .params {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>ВІРТ МОДЕЛІ УКРАЇНИ 💖</h1>
</div>


<!-- ========================= -->
<!-- КАТАЛОГ -->
<!-- ========================= -->

<div id="catalogScreen" class="screen active">

    <div class="toolbar">
        <button class="filter-button" onclick="toggleFilters()">
            Параметри пошуку ▾
        </button>
    </div>

    <div id="filters" class="filters">

        <div class="filter-grid">

            <div>
                <label>Ім'я</label>
                <input
                    id="filterName"
                    type="text"
                    placeholder="Діана"
                    oninput="renderModels()"
                >
            </div>

            <div>
                <label>Максимальний вік</label>
                <input
                    id="filterAge"
                    type="number"
                    placeholder="30"
                    oninput="renderModels()"
                >
            </div>

            <div>
                <label>Мінімальний зріст</label>
                <input
                    id="filterHeight"
                    type="number"
                    placeholder="160"
                    oninput="renderModels()"
                >
            </div>

            <div>
                <label>Максимальна ціна</label>
                <input
                    id="filterPrice"
                    type="number"
                    placeholder="2000"
                    oninput="renderModels()"
                >
            </div>

        </div>

    </div>

    <div id="catalog" class="catalog"></div>

</div>


<!-- ========================= -->
<!-- ПРОФІЛЬ -->
<!-- ========================= -->

<div id="profileScreen" class="screen">

    <div class="profile">

        <button class="back" onclick="showCatalog()">
            ← Назад
        </button>

        <img
            id="profilePhoto"
            class="profile-photo"
            src=""
            alt=""
        >

        <div id="profileName" class="profile-name"></div>

        <div class="profile-params">
            <span id="profileAge"></span>
            <span id="profileHeight"></span>
            <span id="profileWeight"></span>
        </div>

        <div class="price-box">

            <h3>✨ Прайс</h3>

            <div class="price-row">
                <span>Відеодзвінок 10 хв</span>
                <span id="profileVirt" class="price-number"></span>
            </div>

            <div class="price-row">
                <span>Приватні фото / відео</span>
                <span id="profileMedia" class="price-number"></span>
            </div>

            <div class="price-row">
                <span>Спілкування в чаті</span>
                <span id="profileChat" class="price-number"></span>
            </div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- КАБІНЕТ -->
<!-- ========================= -->

<div id="cabinetScreen" class="screen">

    <div class="cabinet">

        <h2>Створити анкету</h2>

        <div class="form-group">
            <label>Ім'я</label>
            <input
                id="name"
                type="text"
                placeholder="Наприклад: Моніка"
            >
        </div>

        <div class="form-group">
            <label>Посилання на фото</label>
            <input
                id="photo"
                type="url"
                placeholder="https://..."
            >
        </div>

        <div class="form-group">
            <label>Вік</label>
            <input
                id="age"
                type="number"
                min="18"
                placeholder="21"
            >
        </div>

        <div class="form-group">
            <label>Зріст</label>
            <input
                id="height"
                type="number"
                placeholder="168"
            >
        </div>

        <div class="form-group">
            <label>Вага</label>
            <input
                id="weight"
                type="number"
                placeholder="50"
            >
        </div>

        <div class="form-group">
            <label>Відеодзвінок 10 хв — грн</label>
            <input
                id="virt"
                type="number"
                placeholder="1000"
            >
        </div>

        <div class="form-group">
            <label>Фото / відео — грн</label>
            <input
                id="media"
                type="number"
                placeholder="1500"
            >
        </div>

        <div class="form-group">
            <label>Чат — грн</label>
            <input
                id="chat"
                type="number"
                placeholder="2000"
            >
        </div>

        <div class="form-group">
            <label>Про себе</label>
            <textarea
                id="description"
                placeholder="Короткий опис..."
            ></textarea>
        </div>

        <button class="save" onclick="saveModel()">
            Опублікувати анкету 🚀
        </button>

    </div>

</div>


<!-- ========================= -->
<!-- НИЖНЄ МЕНЮ -->
<!-- ========================= -->

<div class="bottom">

    <div
        id="homeMenu"
        class="menu active"
        onclick="showCatalog()"
    >
        <span class="icon">🔥</span>
        Головна
    </div>

    <div
        id="cabinetMenu"
        class="menu"
        onclick="showCabinet()"
    >
        <span class="icon">👤</span>
        Кабінет
    </div>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================
   ПОЧАТКОВІ МОДЕЛІ
========================= */

const defaultModels = [

    {
        id: "default-1",
        name: "Діана",
        age: 23,
        height: 167,
        weight: 52,
        virt: 1000,
        media: 1500,
        chat: 2500,
        description: "",
        vip: true,
        photo:
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: "default-2",
        name: "Міла",
        age: 20,
        height: 165,
        weight: 50,
        virt: 1200,
        media: 1800,
        chat: 3000,
        description: "",
        vip: true,
        photo:
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80"
    }

];


let models = [];


/* =========================
   ЗАВАНТАЖЕННЯ
========================= */

async function loadModels() {

    models = [...defaultModels];

    try {

        const response =
            await fetch(
                "/api/models",
                {
                    cache: "no-store"
                }
            );

        if (response.ok) {

            const serverModels =
                await response.json();

            if (Array.isArray(serverModels)) {

                models =
                    [...defaultModels, ...serverModels];

            }

        }

    } catch (error) {

        console.log(
            "Сервер поки недоступний",
            error
        );

    }

    renderModels();
}


/* =========================
   РЕНДЕР КАТАЛОГУ
========================= */

function renderModels() {

    const catalog =
        document.getElementById("catalog");

    const name =
        document
            .getElementById("filterName")
            .value
            .trim()
            .toLowerCase();

    const maxAge =
        Number(
            document
                .getElementById("filterAge")
                .value
        );

    const minHeight =
        Number(
            document
                .getElementById("filterHeight")
                .value
        );

    const maxPrice =
        Number(
            document
                .getElementById("filterPrice")
                .value
        );


    const filtered =
        models.filter(model => {

            if (
                name &&
                !model.name
                    .toLowerCase()
                    .includes(name)
            ) {
                return false;
            }

            if (
                maxAge &&
                Number(model.age) > maxAge
            ) {
                return false;
            }

            if (
                minHeight &&
                Number(model.height) < minHeight
            ) {
                return false;
            }

            if (
                maxPrice &&
                Number(model.virt) > maxPrice
            ) {
                return false;
            }

            return true;

        });


    catalog.innerHTML = "";


    if (!filtered.length) {

        catalog.innerHTML =
            '<div class="empty">Моделей не знайдено.</div>';

        return;
    }


    filtered.forEach(model => {

        const card =
            document.createElement("div");

        card.className = "model-card";


        card.innerHTML = `

            ${
                model.vip
                    ? '<div class="vip">👑 VIP</div>'
                    : ''
            }

            <img
                class="model-photo"
                src="${escapeHtml(model.photo)}"
                alt="${escapeHtml(model.name)}"
            >

            <div class="price">
                від ${escapeHtml(model.virt)} грн
            </div>

            <div class="card-info">

                <p class="name">
                    ${escapeHtml(model.name)}
                </p>

                <div class="params">

                    <span>
                        ${escapeHtml(model.age)} років
                    </span>

                    <span>
                        ${escapeHtml(model.height)} см
                    </span>

                    <span>
                        ${escapeHtml(model.weight)} кг
                    </span>

                </div>

            </div>

        `;


        card.onclick = function() {

            openProfile(model);

        };


        const image =
            card.querySelector("img");

        image.onerror = function() {

            this.src =
                "https://via.placeholder.com/800x1000/202938/ffffff?text=Фото";

        };


        catalog.appendChild(card);

    });

}


/* =========================
   ПРОФІЛЬ
========================= */

function openProfile(model) {

    document
        .getElementById("profilePhoto")
        .src = model.photo;

    document
        .getElementById("profileName")
        .textContent =
            model.name +
            (model.vip ? " 👑" : "");


    document
        .getElementById("profileAge")
        .textContent =
            model.age + " років";


    document
        .getElementById("profileHeight")
        .textContent =
            model.height + " см";


    document
        .getElementById("profileWeight")
        .textContent =
            model.weight + " кг";


    document
        .getElementById("profileVirt")
        .textContent =
            model.virt + " грн";


    document
        .getElementById("profileMedia")
        .textContent =
            model.media + " грн";


    document
        .getElementById("profileChat")
        .textContent =
            model.chat + " грн";


    showScreen("profileScreen");

}


/* =========================
   СТВОРЕННЯ АНКЕТИ
========================= */

async function saveModel() {

    const model = {

        name:
            document
                .getElementById("name")
                .value
                .trim(),

        photo:
            document
                .getElementById("photo")
                .value
                .trim(),

        age:
            Number(
                document
                    .getElementById("age")
                    .value
            ),

        height:
            Number(
                document
                    .getElementById("height")
                    .value
            ),

        weight:
            Number(
                document
                    .getElementById("weight")
                    .value
            ),

        virt:
            Number(
                document
                    .getElementById("virt")
                    .value
            ),

        media:
            Number(
                document
                    .getElementById("media")
                    .value
            ),

        chat:
            Number(
                document
                    .getElementById("chat")
                    .value
            ),

        description:
            document
                .getElementById("description")
                .value
                .trim(),

        vip: false

    };


    /* Перевірки */

    if (!model.name) {

        alert("Вкажи ім'я.");

        return;

    }


    if (model.age < 18) {

        alert(
            "Вік моделі має бути не менше 18 років."
        );

        return;

    }


    if (!model.photo) {

        alert(
            "Вкажи посилання на фото."
        );

        return;

    }


    if (
        !model.photo.startsWith("http://") &&
        !model.photo.startsWith("https://")
    ) {

        alert(
            "Посилання на фото має починатися з https://"
        );

        return;

    }


    /* =========================
       ЗБЕРІГАЄМО НА СЕРВЕРІ
    ========================= */

    try {

        const response =
            await fetch(
                "/api/models",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(model)

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Помилка сервера"
            );

        }


        alert(
            "Анкету успішно додано!"
        );


        clearForm();


        await loadModels();


        showCatalog();


    } catch (error) {

        console.error(error);

        alert(
            "Не вдалося зберегти анкету.\n\n" +
            "Перевір, що сервер і база даних запущені."
        );

    }

}


/* =========================
   ОЧИСТИТИ ФОРМУ
========================= */

function clearForm() {

    document
        .getElementById("name")
        .value = "";

    document
        .getElementById("photo")
        .value = "";

    document
        .getElementById("age")
        .value = "";

    document
        .getElementById("height")
        .value = "";

    document
        .getElementById("weight")
        .value = "";

    document
        .getElementById("virt")
        .value = "";

    document
        .getElementById("media")
        .value = "";

    document
        .getElementById("chat")
        .value = "";

    document
        .getElementById("description")
        .value = "";

}


/* =========================
   ЕКРАНИ
========================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });


    document
        .getElementById(id)
        .classList.add("active");

}


function showCatalog() {

    showScreen("catalogScreen");

    document
        .getElementById("homeMenu")
        .classList.add("active");

    document
        .getElementById("cabinetMenu")
        .classList.remove("active");

}


function showCabinet() {

    showScreen("cabinetScreen");

    document
        .getElementById("homeMenu")
        .classList.remove("active");

    document
        .getElementById("cabinetMenu")
        .classList.add("active");

}


/* =========================
   ФІЛЬТРИ
========================= */

function toggleFilters() {

    document
        .getElementById("filters")
        .classList.toggle("show");

}


/* =========================
   ЗАХИСТ ТЕКСТУ
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ЗАПУСК
========================= */

loadModels();

</script>

</body>
</html>
